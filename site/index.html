<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multiwarden</title>
    <meta name="description" content="All your vaults, working as one." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="vendor/mu.indigo.css" />
    <style>
      :root {
        --mu-font-family-sans-serif: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body { min-height: 100vh; display: flex; flex-direction: column; }
      body > main, body > footer { padding-block: 0; }
      main.container, footer.container { max-width: 52rem; }
      main { flex: 1; }

      .quiet a { color: var(--mu-muted-color); text-decoration: none; }
      .quiet a:hover { color: var(--mu-color); text-decoration: underline; }

      .hero { text-align: center; padding: 7rem 0 4.5rem; }
      .hero img { width: 80px; height: 80px; margin-bottom: 1.75rem; }
      .hero h1 { font-size: clamp(2.2rem, 5vw, 3rem); letter-spacing: -0.03em; margin-bottom: 0.5rem; }
      .hero > p { font-size: 1.2rem; color: var(--mu-muted-color); margin-bottom: 2.25rem; }
      .hero .btn { margin: 0; }
      .hero small { display: block; margin-top: 0.6rem; color: var(--mu-muted-color); }
      .hero small:first-of-type { margin-top: 1.1rem; }

      .shot { margin: 0 0 6rem; text-align: center; }
      .shot img { width: 360px; max-width: 100%; height: auto; border-radius: 18px; box-shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 12px 40px rgb(30 30 80 / 14%); }
      .shot figcaption { margin-top: 1.5rem; color: var(--mu-muted-color); font-size: 0.95rem; line-height: 1.6; }

      footer { padding: 0 0 2.5rem; text-align: center; font-size: 0.85rem; color: var(--mu-muted-color); }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="hero">
        <img src="logo.png" alt="" />
        <h1>Multiwarden</h1>
        <p>All your vaults, working as one.</p>
        <a id="download" href="https://github.com/multiwarden/clients/releases/latest" class="btn btn-primary">Download</a>
        <small id="others" class="quiet">
          <a href="https://github.com/multiwarden/clients/releases/latest">Chrome, Edge, Opera, Firefox and Safari</a>
        </small>
        <small class="quiet">
          <span id="version"></span>
          <a href="https://github.com/multiwarden/clients#install">How to install</a> ·
          <a href="https://github.com/multiwarden/clients/releases">Older versions</a>
        </small>
      </div>

      <figure class="shot">
        <img src="screenshot.png" width="480" height="640" alt="The Multiwarden popup in Combined view: GitHub logins from a personal and a work account side by side, each marked with its account's avatar." />
        <figcaption>Autofill, saving and passkeys work across every unlocked account.<br />Combined view puts all your vaults in one list.</figcaption>
      </figure>
    </main>

    <footer class="container quiet">
      <a href="https://github.com/multiwarden">GitHub</a> · Unofficial · GPL-3.0 · Not affiliated with Bitwarden, Inc.
    </footer>

    <script>
      const REPO = "multiwarden/clients";
      const BROWSERS = [
        ["chrome", "Chrome"],
        ["edge", "Edge"],
        ["opera", "Opera"],
        ["firefox", "Firefox"],
        ["safari", "Safari"],
      ];
      const ua = navigator.userAgent;
      const mine = /Firefox\//.test(ua)
        ? "firefox"
        : /Edg\//.test(ua)
          ? "edge"
          : /OPR\//.test(ua)
            ? "opera"
            : /Safari\//.test(ua) && !/Chrome|Chromium/.test(ua)
              ? "safari"
              : "chrome";

      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const zipFor = (r, key) => (r.assets || []).find((a) => a.name.startsWith(`multiwarden-${key}-`) && a.name.endsWith(".zip"));
      const label = (key) => BROWSERS.find(([k]) => k === key)[1];

      fetch(`https://api.github.com/repos/${REPO}/releases?per_page=10`)
        .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
        .then((releases) => {
          const latest = releases.find((r) => !r.draft && !r.prerelease);
          if (!latest) return;

          const own = zipFor(latest, mine);
          if (own) {
            const button = document.getElementById("download");
            button.href = own.browser_download_url;
            button.textContent = `Download for ${label(mine)}`;
          }

          const others = BROWSERS.filter(([key]) => key !== mine || !own)
            .map(([key, name]) => [name, zipFor(latest, key)])
            .filter(([, asset]) => asset)
            .map(([name, asset]) => `<a href="${esc(asset.browser_download_url)}">${name}</a>`);
          if (others.length) {
            document.getElementById("others").innerHTML = `${own ? "Also for " : ""}${others.join(" · ")}`;
          }

          document.getElementById("version").innerHTML =
            `<a href="${esc(latest.html_url)}">Version ${esc(latest.tag_name.replace(/^v/, ""))}</a> · `;
        })
        .catch(() => {});
    </script>
  </body>
</html>
