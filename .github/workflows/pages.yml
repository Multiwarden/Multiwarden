# Publishes the website (site/) to GitHub Pages at multiwarden.com.
# Releases are read live from the GitHub API of multiwarden/clients, so the site doesn't need
# rebuilding per release.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "logo/logo512.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp logo/logo512.png _site/logo.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
