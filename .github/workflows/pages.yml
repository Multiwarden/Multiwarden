# Builds the website (site/, an Astro project) and publishes it to GitHub Pages.
#
# Releases are read from the GitHub API at build time, so the site is rebuilt:
# - on every change to the site on main,
# - every hour, deploying only when the release list changed since the last deploy,
# - on a `repository_dispatch` of type `release`, which the app repositories can send after
#   publishing a release to update the site straight away,
# - by hand from the Actions tab.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "logo/logo512.png"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # Scheduled runs only deploy when a release was added, changed or removed.
      - name: Compare releases with the live site
        id: compare
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          domain="$(cat CNAME)"
          if curl -fsSL "https://$domain/releases.json" -o /tmp/live.json && cmp -s /tmp/live.json dist/releases.json; then
            echo "Releases unchanged; skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.compare.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.compare.outputs.changed == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
